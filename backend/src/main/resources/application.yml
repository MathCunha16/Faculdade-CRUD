spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:faculdade}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:Developer123}
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never # Desabilitado - usando Flyway para migrações e dados iniciais

  defer-datasource-initialization: true

# Configurações de segurança da aplicação
app:
  security:
    jwt-secret: ${JWT_SECRET:change-this-secret-key-in-production-minimum-256-bits-required-for-security}
    jwt-expiration: ${JWT_EXPIRATION:86400000} # 24 horas em milissegundos
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4200}

# Configurações do servidor
server:
  port: ${APP_PORT:8080}